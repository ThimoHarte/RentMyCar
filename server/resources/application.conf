server {
    port = 8080
    port = ${?PORT}
    host = "0.0.0.0"
    host = ${?HOST}
}
jwt {
    audience = "rentmycar-api"
    audience = ${?JWT_AUDIENCE}

    issuer = "http://localhost:8080"
    issuer = ${?JWT_ISSUER}

    realm = "rentmycar"

    # Only for your own computer: on a real server JWT_SECRET must be set (at least 32 characters)
    secret = "only-for-local-development-change-me-please"
    secret = ${?JWT_SECRET}
}
